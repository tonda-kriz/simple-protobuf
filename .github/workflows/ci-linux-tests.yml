name: Linux GPB compatibility

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    name: ${{ matrix.os }}, ${{ matrix.compiler }}-${{ matrix.version }}, ${{ matrix.build_type }}, sanitizer:${{ matrix.sanitizer }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            build_type: Release
            version: "13"
            sanitizer: "OFF"
          - os: ubuntu-latest
            compiler: gcc
            build_type: Release
            version: "14"
            sanitizer: "ON"
          - os: ubuntu-latest
            compiler: gcc
            build_type: Release
            version: "14"
            sanitizer: "OFF"
          - os: ubuntu-latest
            compiler: gcc
            build_type: Release
            version: "15"
            sanitizer: "OFF"
          - os: ubuntu-latest
            compiler: gcc
            build_type: Release
            version: "16"
            sanitizer: "OFF"
          - os: ubuntu-latest
            compiler: gcc
            build_type: Debug
            version: "14"
            sanitizer: "ON"
          - os: ubuntu-latest
            compiler: clang
            build_type: Release
            version: "17"
            sanitizer: "OFF"
          - os: ubuntu-latest
            compiler: clang
            build_type: Release
            version: "18"
            sanitizer: "OFF"
          - os: ubuntu-latest
            compiler: clang
            build_type: Release
            version: "19"
            sanitizer: "OFF"
          - os: ubuntu-latest
            compiler: clang
            build_type: Release
            version: "20"
            sanitizer: "OFF"
          - os: ubuntu-latest
            compiler: clang
            build_type: Release
            version: "18"
            sanitizer: "ON"
          - os: ubuntu-latest
            compiler: clang
            build_type: Debug
            version: "18"
            sanitizer: "ON"

    steps:
      - uses: actions/checkout@v4

      - name: Install common dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache software-properties-common

      - name: Install GCC
        if: matrix.compiler == 'gcc'
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-${{ matrix.version }} g++-${{ matrix.version }}
          printf 'CC=gcc-%s\nCXX=g++-%s\n' \
            '${{ matrix.version }}' '${{ matrix.version }}' >> "$GITHUB_ENV"

      - name: Install Clang
        if: matrix.compiler == 'clang'
        run: |
          sudo apt-get install -y --no-install-recommends clang-${{ matrix.version }}
          printf 'CC=clang-%s\nCXX=clang++-%s\n' \
            '${{ matrix.version }}' '${{ matrix.version }}' >> "$GITHUB_ENV"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-${{ matrix.compiler }}-${{ matrix.version }}-${{ matrix.build_type }}-${{ matrix.sanitizer }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.compiler }}-${{ matrix.version }}-${{ matrix.build_type }}-${{ matrix.sanitizer }}-

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DSPB_PROTO_BUILD_TESTS=ON \
            -DSPB_PROTO_BUILD_EXAMPLES=ON \
            -DSPB_PROTO_BUILD_COMPATIBILITY_TESTS=ON \
            -DSPB_PROTO_BUILD_ETL_TESTS=ON \
            -DSPB_PROTO_USE_ADDRESS_SANITIZER=${{ matrix.sanitizer }} \
            -DSPB_PROTO_USE_UB_SANITIZER=${{ matrix.sanitizer }}

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
