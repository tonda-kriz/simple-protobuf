name: MacOS build

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    name: ${{ matrix.os }}, ${{ matrix.compiler.name || matrix.compiler }}-${{ matrix.compiler.version || 'default' }}
    runs-on: ${{ matrix.os }}

    env:
      CC: clang
      CXX: clang++

    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
        compiler:
          - appleclang
          - { name: clang, version: 14 }
          - { name: clang, version: 15 }
          - { name: clang, version: 16 }
          - { name: clang, version: 17 }
          - { name: clang, version: 18 }
          - { name: clang, version: 19 }
          - { name: clang, version: 20 }
          - { name: clang, version: 21 }
          - { name: gcc, version: 12 }
          - { name: gcc, version: 13 }
          - { name: gcc, version: 14 }
          - { name: gcc, version: 15 }

    steps:
      - uses: actions/checkout@v4

      - name: Install Clang
        if: matrix.compiler.name == 'clang'
        run: |
          brew install llvm@${{ matrix.compiler.version }}
          LLVM_PREFIX="$(brew --prefix llvm@${{ matrix.compiler.version }})"
          printf 'CC=%s/bin/clang\nCXX=%s/bin/clang++\n' \
            "$LLVM_PREFIX" "$LLVM_PREFIX" >> "$GITHUB_ENV"

      - name: Install GCC
        if: matrix.compiler.name == 'gcc'
        run: |
          brew install gcc@${{ matrix.compiler.version }}
          GCC_PREFIX="$(brew --prefix gcc@${{ matrix.compiler.version }})"
          printf 'CC=%s/bin/gcc-%s\nCXX=%s/bin/g++-%s\n' \
            "$GCC_PREFIX" '${{ matrix.compiler.version }}' \
            "$GCC_PREFIX" '${{ matrix.compiler.version }}' >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSPB_PROTO_BUILD_TESTS=ON \
            -DSPB_PROTO_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
