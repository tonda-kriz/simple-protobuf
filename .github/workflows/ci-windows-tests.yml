name: Windows build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: ${{ matrix.os }} - ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: Win32
          - os: windows-2022
            platform: x64
          - os: windows-2022
            platform: ARM
            sdk: 10.0.22621.0
          - os: windows-2025
            platform: Win32
          - os: windows-2025
            platform: x64
          - os: windows-11-arm
            platform: ARM64

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        env:
          CMAKE_SYSTEM_VERSION: ${{ matrix.sdk }}
        run: |
          $cmakeArgs = @(
            "-S", ".",
            "-B", "build",
            "-A", "${{ matrix.platform }}",
            "-DSPB_PROTO_BUILD_TESTS=ON",
            "-DSPB_PROTO_BUILD_EXAMPLES=ON"
          )

          if ($env:CMAKE_SYSTEM_VERSION) {
            $cmakeArgs += "-DCMAKE_SYSTEM_VERSION=$env:CMAKE_SYSTEM_VERSION"
          }

          cmake @cmakeArgs

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
