name: Windows build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    name: ${{ matrix.os }} - ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: Win32
          - os: windows-2022
            platform: x64
          - os: windows-2025
            platform: Win32
          - os: windows-2025
            platform: x64
          - os: windows-11-arm
            platform: ARM64

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >-
          cmake -S . -B build
          -A ${{ matrix.platform }}
          -DSPB_PROTO_BUILD_TESTS=ON
          -DSPB_PROTO_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
