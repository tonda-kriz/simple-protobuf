name: Code coverage report

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build gcc-16 g++-16 lcov

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER=gcc-16 \
            -DCMAKE_CXX_COMPILER=g++-16 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DSPB_PROTO_BUILD_TESTS=ON \
            -DSPB_PROTO_USE_COVERAGE=ON

      - name: Build
        run: cmake --build build --target unit_tests --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Capture library coverage
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          lcov --capture \
            --directory . \
            --gcov-tool gcov-16 \
            --rc geninfo_unexecuted_blocks=1 \
            --exclude '/usr/*' \
            --exclude '*/test/*' \
            --output-file coverage-all.info \
            --quiet

          lcov --extract coverage-all.info '*/include/*' \
            --output-file coverage.info \
            --quiet

      - name: Show library coverage summary
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          summary="$(lcov --summary coverage.info 2>&1)"
          printf '%s\n' "$summary"

          {
            echo "## Library coverage"
            echo
            echo '```text'
            printf '%s\n' "\$summary"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate library report
        if: github.event_name != 'pull_request'
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          report_dir="report/library"
          mkdir -p "$report_dir"
          genhtml coverage.info \
            --output-directory "$report_dir" \
            --quiet

          coverage="$(
            lcov --summary coverage.info 2>&1 |
              awk -F'[:%]' '/lines/ {
                gsub(/[[:space:]]/, "", $2)
                print $2
                exit
              }'
          )"

          if [[ -z "$coverage" ]]; then
            echo "Could not parse library line coverage" >&2
            exit 1
          fi

          if awk -v value="$coverage" 'BEGIN { exit !(value <= 50) }'; then
            color=red
          elif awk -v value="$coverage" 'BEGIN { exit !(value > 80) }'; then
            color=brightgreen
          else
            color=orange
          fi

          curl --fail --silent --show-error --retry 3 \
            "https://img.shields.io/badge/library_coverage-${coverage}%25-${color}?logo=github" \
            --output "$report_dir/coverage.svg"

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/report

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: coverage
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
