name: Code coverage report

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build gcc-16 g++-16

      - name: Install LCOV
        run: |
          git clone --depth 1 --branch v2.6 \
            https://github.com/linux-test-project/lcov.git \
            "$RUNNER_TEMP/lcov"
          sudo make -C "$RUNNER_TEMP/lcov" install LCOV_NO_DOC=1 LCOV_NO_XS=1
          lcov --version

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER=gcc-16 \
            -DCMAKE_CXX_COMPILER=g++-16 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DSPB_PROTO_BUILD_TESTS=ON \
            -DSPB_PROTO_BUILD_COMPILER_TESTS=ON \
            -DSPB_PROTO_USE_COVERAGE=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Capture coverage
        working-directory: build
        run: |
          lcov --capture \
            --directory . \
            --gcov-tool gcov-16 \
            --rc geninfo_unexecuted_blocks=1 \
            --exclude '/usr/*' \
            --exclude '*/test/*' \
            --output-file coverage.info \
            --quiet

      - name: Show overall coverage summary
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          summary="$(lcov --summary coverage.info 2>&1)"
          printf '%s\n' "$summary"

          {
            echo "## Overall coverage"
            echo
            echo '```text'
            printf '%s\n' "\$summary"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate coverage reports
        if: github.event_name != 'pull_request'
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          make_report() {
            local label="$1"
            local operation="$2"
            local pattern="$3"
            local output_dir="$4"
            local tracefile="${label}.info"
            local summary
            local coverage
            local color

            lcov "$operation" coverage.info "$pattern" \
              --output-file "$tracefile" \
              --quiet

            mkdir -p "$output_dir"
            genhtml "$tracefile" \
              --output-directory "$output_dir" \
              --quiet

            summary="$(lcov --summary "$tracefile" 2>&1)"
            coverage="$(printf '%s\n' "$summary" |
              awk -F'[:%]' '/lines/ {
                gsub(/[[:space:]]/, "", $2)
                print $2
                exit
              }')"

            if [[ -z "$coverage" ]]; then
              echo "Could not parse line coverage for $label" >&2
              exit 1
            fi

            if awk -v value="$coverage" 'BEGIN { exit !(value <= 50) }'; then
              color=red
            elif awk -v value="$coverage" 'BEGIN { exit !(value > 80) }'; then
              color=brightgreen
            else
              color=orange
            fi

            curl --fail --silent --show-error --retry 3 \
              "https://img.shields.io/badge/${label}_coverage-${coverage}%25-${color}?logo=github" \
              --output "$output_dir/coverage.svg"
          }

          make_report compiler --extract '*/compiler/*' report/compiler
          make_report rest --remove '*/compiler/*' report/rest

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/report

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: coverage
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
